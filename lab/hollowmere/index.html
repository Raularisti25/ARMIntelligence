<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hollowmere</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f22; overflow: hidden; }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; outline: none; }
    #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at 50% 42%, #1d2547 0%, #0b0f22 70%); color: #f1e3c6; transition: opacity .8s ease; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .t { font: 500 46px/1 "Iowan Old Style", Palatino, Georgia, serif; letter-spacing: .12em; text-shadow: 0 0 28px rgba(159, 232, 255, .35); }
    #boot .s { font: italic 400 15px/1 "Iowan Old Style", Palatino, Georgia, serif; color: rgba(241, 227, 198, .6); letter-spacing: .06em; animation: b 1.8s ease-in-out infinite; }
    @keyframes b { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot"><div class="t">Hollowmere</div><div class="s" id="boot-s">waking the house…</div></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // keep-alive for the local launcher: scripts/serve.mjs exits ~45 s after the last ping
    (function ping() { fetch('/__alive', { cache: 'no-store' }).catch(function () {}); setTimeout(ping, 10000); })();
  </script>
</body>
</html>
